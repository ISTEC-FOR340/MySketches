<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El peso de las palabras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- BACK -->
<button onclick="window.location.href='../index.html'" class="back-btn" aria-label="Back to home">
  ⬅ Back
</button>

<!-- UI PANEL -->
<div id="gui">

  <h1>El peso de las palabras</h1>

  <p class="description">
    Spoken words become physical.
    Letters float, collide, and eventually fall under gravity.
    Language is no longer symbolic — it has weight.
  </p>

  <p class="instructions">
    Click to activate voice<br>
    Press SPACE to release gravity
  </p>

  <div class="controls">

    <label>
      Size
      <input type="range" id="sizeSlider" min="16" max="120" value="32">
    </label>

    <label>
      Font
      <select id="fontSelect">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier</option>
        <option value="Verdana">Verdana</option>
        <option value="Times New Roman">Times</option>
      </select>
    </label>

    <button id="reloadButton">Reset microphone</button>

  </div>

</div>

<script src="sketch.js"></script>

</body>
</html>
