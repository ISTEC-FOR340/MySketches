<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circle Matrix Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- UI PANEL -->
<div class="ui-panel">
  <h1>Circle Matrix</h1>
  <p class="description">
    Transform an image into a dynamic field of particles.  
    The image dissolves into circles that react to your presence.
  </p>

  <div class="controls">
    <input type="file" id="imageLoader" accept="image/*">

    <label>Columns: <span id="val-cols">60</span> <input type="range" id="cols" min="10" max="200" value="60"></label>
    <label>Rows: <span id="val-rows">60</span> <input type="range" id="rows" min="10" max="200" value="60"></label>
    <label>Circle Size: <span id="val-radius">6</span> <input type="range" id="radius" min="2" max="20" value="6"></label>
    <label>Interaction Radius: <span id="val-mouseSize">80</span> <input type="range" id="mouseSize" min="10" max="200" value="80"></label>
  </div>
</div>

<button onclick="window.location.href='../index.html'" class="back-btn">
  ⬅ Back
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="sketch.js"></script>

</body>
</html>
